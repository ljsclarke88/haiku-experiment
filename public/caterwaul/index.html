<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caterwaul</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #070809;
      color: #c8c2b8;
      font-family: 'Cormorant Garamond', serif;
      overflow: hidden;
    }

    #back {
      position: fixed; top: 28px; left: 32px;
      font-size: 12px; letter-spacing: 0.3em; text-transform: uppercase;
      color: rgba(200,194,184,0.4); text-decoration: none; z-index: 10;
      transition: color 0.3s;
    }
    #back:hover { color: rgba(200,194,184,0.9); }

    /* ── state system ── */
    .state {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 40px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.9s ease;
      z-index: 2;
    }
    .state.active { opacity: 1; pointer-events: all; }

    /* ── intro ── */
    #s-intro h1 {
      font-size: clamp(3rem, 7vw, 5.5rem); font-weight: 300;
      letter-spacing: 0.45em; text-transform: uppercase;
      color: #e8e2da; margin-bottom: 0.5rem;
    }
    #s-intro .sub {
      font-size: 0.90rem; font-style: italic; font-weight: 300;
      color: rgba(200,194,184,0.38); letter-spacing: 0.06em;
      margin-bottom: 3.5rem;
    }
    #begin-btn {
      background: none; border: 1px solid rgba(200,194,184,0.22);
      color: rgba(200,194,184,0.65); font-family: 'Cormorant Garamond', serif;
      font-size: 0.78rem; letter-spacing: 0.38em; text-transform: uppercase;
      padding: 0.8rem 3rem; cursor: pointer;
      transition: border-color 0.3s, color 0.3s;
    }
    #begin-btn:hover { border-color: rgba(200,194,184,0.65); color: #e8e2da; }

    /* ── listening ── */
    #s-listen { justify-content: center; gap: 0; }

    #viz {
      display: block;
      width: min(600px, 88vw);
      height: 80px;
    }

    #out {
      margin-top: 52px; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      min-height: 150px; justify-content: center;
      opacity: 0; transform: translateY(10px);
      transition: opacity 0.85s ease, transform 0.85s ease;
    }
    #out.on { opacity: 1; transform: translateY(0); }

    #out-label {
      font-size: 0.64rem; letter-spacing: 0.44em; text-transform: uppercase;
      color: rgba(200,194,184,0.30);
    }
    #out-meaning {
      font-size: clamp(1.6rem, 3.4vw, 2.3rem); font-style: italic; font-weight: 300;
      color: #e8e2da; line-height: 1.25;
    }
    #out-science {
      font-size: 0.71rem; font-weight: 300; line-height: 1.80;
      color: rgba(200,194,184,0.28); max-width: 420px; letter-spacing: 0.03em;
    }
    #conf-bar { width: 90px; height: 1px; background: rgba(200,194,184,0.10); margin-top: 2px; }
    #conf-fill { height: 100%; width: 0%; background: rgba(200,194,184,0.40); transition: width 0.5s ease; }

    /* ── status ── */
    #status {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      font-size: 0.63rem; letter-spacing: 0.42em; text-transform: uppercase;
      color: rgba(200,194,184,0.25); white-space: nowrap; z-index: 10;
    }
    #status.pulse { animation: blink 2.6s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:0.28} 50%{opacity:0.85} }
  </style>
</head>
<body>

<a href="/" id="back">← Lab</a>

<!-- Intro — shown before microphone permission is granted -->
<div id="s-intro" class="state active">
  <h1>Caterwaul</h1>
  <p class="sub">a realtime cat translator...maybe</p>
  <button id="begin-btn">begin listening</button>
</div>

<!-- Listening — shown once mic is live -->
<div id="s-listen" class="state">
  <canvas id="viz"></canvas>
  <div id="out">
    <div id="out-label"></div>
    <div id="out-meaning"></div>
    <div id="out-science"></div>
    <div id="conf-bar"><div id="conf-fill"></div></div>
  </div>
</div>

<div id="status" class="pulse">loading…</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
<script>
'use strict';

// ── Cat vocalisation science ────────────────────────────────────────────────
// Sources: Schötz (2013, 2016), McComb et al. (2009), Bradshaw (2013),
//          Moelk (1944 — first systematic phonetic classification of cat sounds).
const TRANSLATIONS = {
  Cat: {
    label:   'vocalisation',
    meaning: 'I am here',
    science: 'A general cat sound. Intent depends on pitch, duration and context — watch body language for further cues. (Moelk, 1944)',
  },
  Purr: {
    label:   'purr',
    meaning: 'I feel safe',
    science: 'Cats purr at 25–150 Hz. A self-soothing signal also used to solicit care. The solicitation purr embeds a higher-frequency cry that humans find hard to ignore. (McComb et al., 2009)',
  },
  Meow: {
    label:   'meow',
    meaning: 'I need something',
    science: 'Adult cats rarely meow at each other — this sound evolved almost exclusively to communicate with humans. Pitch and duration carry the specific demand. (Bradshaw, 2013)',
  },
  Hiss: {
    label:   'hiss',
    meaning: 'Back away',
    science: 'A defensive warning thought to mimic snake sounds. The cat feels cornered — this is a final caution before escalation.',
  },
  Caterwaul: {
    label:   'caterwaul',
    meaning: 'Stay away from me',
    science: 'Used in territorial disputes, mating calls, or intense distress. Females caterwaul during estrus. One of the oldest and most primal cat vocalisations. (Schötz, 2016)',
  },
  Chirp: {
    label:   'chirp / trill',
    meaning: 'Come here',
    science: 'A short rising trill used by mothers to call kittens, and by cats greeting familiar humans. A sign of friendly intent and excitement. (Schötz, 2013)',
  },
};

// ── Constants ─────────────────────────────────────────────────────────────
const KEYWORDS       = ['Caterwaul', 'Purr', 'Meow', 'Hiss', 'Chirp', 'Cat'];
const CAT_THRESHOLD  = 0.85;   // ~90% certainty — only confident cat detections
const TARGET_SR      = 16000;
const FRAME_LEN      = 15600;  // 0.975 s at 16 kHz — YAMNet's native window
const ONSET_THRESH   = 0.022;  // RMS energy to detect sound onset
const PRE_BUF_SEC    = 0.35;   // seconds of audio to keep before onset
const SILENCE_GAP_MS = 500;    // ms of quiet that marks end of a clip
const MIN_CLIP_SEC   = 0.30;   // clips shorter than this are discarded
const MAX_CLIP_SEC   = 5.0;    // hard cap on clip length

// ── State ──────────────────────────────────────────────────────────────────
let model = null, catIndices = [], modelReady = false;
let classifying = false, fadeTimer = null;
let analyser = null;
let waveHue  = 0;

// Clip capture state
let nativeSR    = 44100;
let isRecording = false;
let clipBuffer  = [];
let preBuffer   = [];
let silenceTimer = null;

// ── DOM ────────────────────────────────────────────────────────────────────
const sIntro   = document.getElementById('s-intro');
const sListen  = document.getElementById('s-listen');
const statusEl = document.getElementById('status');
const outDiv   = document.getElementById('out');
const outLabel = document.getElementById('out-label');
const outMean  = document.getElementById('out-meaning');
const outSci   = document.getElementById('out-science');
const confFill = document.getElementById('conf-fill');
const canvas   = document.getElementById('viz');

function show(el) {
  document.querySelectorAll('.state').forEach(s => s.classList.remove('active'));
  el.classList.add('active');
}
function setStatus(txt, pulse = true) {
  statusEl.textContent = txt;
  statusEl.classList.toggle('pulse', pulse);
}

// ── Canvas ─────────────────────────────────────────────────────────────────
function resizeCanvas() {
  const r = devicePixelRatio || 1;
  canvas.width  = canvas.offsetWidth  * r;
  canvas.height = canvas.offsetHeight * r;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ── Waveform ───────────────────────────────────────────────────────────────
function drawViz() {
  requestAnimationFrame(drawViz);
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  if (!analyser) return;

  const buf = new Float32Array(analyser.frequencyBinCount);
  analyser.getFloatTimeDomainData(buf);

  waveHue += (outDiv.classList.contains('on') ? 1 : -1) * 0.04;
  waveHue  = Math.max(0, Math.min(1, waveHue));

  const a = 0.28 + waveHue * 0.55;
  const cr = Math.round(158 + waveHue * 57);
  const cg = Math.round(150 + waveHue * 14);
  const cb = Math.round(140 - waveHue * 54);
  ctx.strokeStyle = `rgba(${cr},${cg},${cb},${a})`;
  ctx.lineWidth   = (1.2 + waveHue * 0.9) * (devicePixelRatio || 1);
  ctx.lineJoin    = 'round';

  ctx.beginPath();
  const step = W / (buf.length - 1);
  for (let i = 0; i < buf.length; i++) {
    const x = i * step;
    const y = (buf[i] * 0.65 + 0.5) * H;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
}
drawViz();

// ── Show translation + speak ──────────────────────────────────────────────
function showAndSpeak(keyword, score) {
  const t = TRANSLATIONS[keyword] || TRANSLATIONS.Cat;
  outLabel.textContent = t.label;
  outMean.textContent  = `"${t.meaning}"`;
  outSci.textContent   = t.science;
  confFill.style.width = Math.round(score * 100) + '%';
  outDiv.classList.add('on');
  setStatus('cat detected', false);

  // Speak the meaning after the visual fades in
  setTimeout(() => {
    window.speechSynthesis.cancel();
    const utt   = new SpeechSynthesisUtterance(t.meaning);
    utt.lang    = 'en-GB';
    utt.rate    = 0.88;
    utt.pitch   = 1.0;
    window.speechSynthesis.speak(utt);
  }, 700);

  clearTimeout(fadeTimer);
  fadeTimer = setTimeout(() => {
    outDiv.classList.remove('on');
    setStatus('listening for your cat');
  }, 7000);
}

// ── Classify a complete clip ──────────────────────────────────────────────
// Resamples the raw native-rate clip to 16 kHz via OfflineAudioContext,
// then runs YAMNet on overlapping 0.975 s windows. Only translates if the
// highest cat-class score across all windows reaches CAT_THRESHOLD.
async function classifyClip(clip, sourceSR) {
  if (classifying || !model) return;
  classifying = true;
  setStatus('translating…', false);

  try {
    // Resample to 16 kHz
    const targetLen = Math.ceil(clip.length * TARGET_SR / sourceSR);
    const offCtx    = new OfflineAudioContext(1, targetLen, TARGET_SR);
    const buf       = offCtx.createBuffer(1, clip.length, sourceSR);
    buf.copyToChannel(clip, 0);
    const src       = offCtx.createBufferSource();
    src.buffer = buf; src.connect(offCtx.destination); src.start(0);
    const rendered  = await offCtx.startRendering();
    const s16       = rendered.getChannelData(0);

    // Pad to at least one full YAMNet frame
    const padded = s16.length >= FRAME_LEN ? s16 : (() => {
      const p = new Float32Array(FRAME_LEN); p.set(s16); return p;
    })();

    let bestScore = 0, bestKw = null;
    const hop = FRAME_LEN >> 1;

    for (let off = 0; off + FRAME_LEN <= padded.length; off += hop) {
      const frame = padded.slice(off, off + FRAME_LEN);
      const inp   = tf.tensor1d(frame);
      const raw   = model.predict(inp);

      const scT   = Array.isArray(raw) ? raw[0] : (raw.scores ?? raw);
      const sc    = await scT.data();
      inp.dispose();
      (Array.isArray(raw) ? raw : [raw]).forEach(t => t.dispose());

      for (const { idx, keyword } of catIndices) {
        if (sc[idx] > bestScore) { bestScore = sc[idx]; bestKw = keyword; }
      }
    }

    if (bestScore >= CAT_THRESHOLD) {
      showAndSpeak(bestKw, bestScore);
    } else {
      setStatus('listening for your cat');
    }

  } catch (err) {
    console.warn('classifyClip:', err);
    setStatus('listening for your cat');
  }

  classifying = false;
}

// ── Clip end: validate length and hand off to classifier ─────────────────
function endClip() {
  clearTimeout(silenceTimer);
  silenceTimer = null;
  isRecording  = false;

  const clip = new Float32Array(clipBuffer);
  clipBuffer  = [];

  if (clip.length < nativeSR * MIN_CLIP_SEC) {
    // Too brief — background thump, not a vocalisation
    setStatus('listening for your cat');
    return;
  }

  classifyClip(clip, nativeSR);
}

// ── Load YAMNet model + class labels ─────────────────────────────────────
async function loadModel() {
  setStatus('loading…');

  const csv = await fetch(
    'https://raw.githubusercontent.com/tensorflow/models/master/research/audioset/yamnet/yamnet_class_map.csv'
  ).then(r => r.text());

  const labels = csv.trim().split('\n').slice(1).map(row => {
    const cols = row.split(',');
    return cols.slice(2).join(',').replace(/^"|"$/g, '').trim();
  });

  catIndices = labels.flatMap((label, idx) => {
    const keyword = KEYWORDS.find(k => label.toLowerCase().includes(k.toLowerCase()));
    return keyword ? [{ idx, keyword }] : [];
  });

  model = await tf.loadGraphModel(
    'https://storage.googleapis.com/tfhub-tfjs-modules/google/tfjs-model/yamnet/classification/tfjs/1/model.json'
  );

  // Warm-up
  const warmup = tf.zeros([FRAME_LEN]);
  const wOut   = model.predict(warmup);
  (Array.isArray(wOut) ? wOut : [wOut]).forEach(t => t.dispose());
  warmup.dispose();

  modelReady = true;
  setStatus('ready — press begin');
}

// ── Microphone capture + onset/offset detection ───────────────────────────
async function startMic() {
  const stream   = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  nativeSR       = audioCtx.sampleRate;

  const source = audioCtx.createMediaStreamSource(stream);

  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = 0.82;
  source.connect(analyser);

  const proc = audioCtx.createScriptProcessor(4096, 1, 1);
  source.connect(proc);

  // Silent sink — required for onaudioprocess to fire in all browsers
  const sink = audioCtx.createGain();
  sink.gain.value = 0;
  proc.connect(sink);
  sink.connect(audioCtx.destination);

  const PRE_BUF_SAMPLES = Math.ceil(PRE_BUF_SEC * nativeSR);
  const MAX_CLIP_SAMPLES = Math.ceil(MAX_CLIP_SEC * nativeSR);

  proc.onaudioprocess = e => {
    const input = Array.from(e.inputBuffer.getChannelData(0));

    // RMS energy of this chunk
    let sum = 0;
    for (const s of input) sum += s * s;
    const rms = Math.sqrt(sum / input.length);

    if (!isRecording) {
      // Keep a rolling pre-onset buffer
      preBuffer.push(...input);
      if (preBuffer.length > PRE_BUF_SAMPLES) {
        preBuffer = preBuffer.slice(-PRE_BUF_SAMPLES);
      }

      if (rms > ONSET_THRESH && !classifying) {
        // Sound onset — start clip, prepend pre-buffer for clean onset
        isRecording = true;
        clipBuffer  = [...preBuffer, ...input];
        preBuffer   = [];
      }
    } else {
      clipBuffer.push(...input);

      if (rms < ONSET_THRESH) {
        // Sound fading — start silence countdown if not already running
        if (!silenceTimer) {
          silenceTimer = setTimeout(endClip, SILENCE_GAP_MS);
        }
      } else {
        // Sound continues — cancel any pending end
        clearTimeout(silenceTimer);
        silenceTimer = null;
      }

      // Hard cap — end the clip if it's grown too long
      if (clipBuffer.length >= MAX_CLIP_SAMPLES) {
        endClip();
      }
    }
  };

  show(sListen);
  setStatus('listening for your cat');
}

// ── Begin button ──────────────────────────────────────────────────────────
document.getElementById('begin-btn').addEventListener('click', async () => {
  try {
    if (!modelReady) setStatus('loading model…');
    // Wait for model if still loading
    while (!modelReady) await new Promise(r => setTimeout(r, 200));
    await startMic();
  } catch (err) {
    console.error(err);
    setStatus('microphone access denied', false);
  }
});

// ── Boot — load model immediately so it's ready when the user clicks ──────
loadModel().catch(err => {
  console.error(err);
  setStatus('model failed to load', false);
});
</script>

</body>
</html>
