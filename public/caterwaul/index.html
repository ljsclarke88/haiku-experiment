<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caterwaul</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #070809;
      color: #c8c2b8;
      font-family: 'Cormorant Garamond', serif;
      overflow: hidden;
    }

    #back {
      position: fixed; top: 28px; left: 32px;
      font-size: 12px; letter-spacing: 0.3em; text-transform: uppercase;
      color: rgba(200,194,184,0.4); text-decoration: none; z-index: 10;
      transition: color 0.3s;
    }
    #back:hover { color: rgba(200,194,184,0.9); }

    .state {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 40px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.9s ease;
      z-index: 2;
    }
    .state.active { opacity: 1; pointer-events: all; }

    /* ── intro ── */
    #s-intro h1 {
      font-size: clamp(3rem, 7vw, 5.5rem); font-weight: 300;
      letter-spacing: 0.45em; text-transform: uppercase;
      color: #e8e2da; margin-bottom: 0.5rem;
    }
    #s-intro .sub {
      font-size: 0.90rem; font-style: italic; font-weight: 300;
      color: rgba(200,194,184,0.38); letter-spacing: 0.06em;
      margin-bottom: 3.5rem;
    }
    #begin-btn {
      background: none; border: 1px solid rgba(200,194,184,0.22);
      color: rgba(200,194,184,0.65); font-family: 'Cormorant Garamond', serif;
      font-size: 0.78rem; letter-spacing: 0.38em; text-transform: uppercase;
      padding: 0.8rem 3rem; cursor: pointer;
      transition: border-color 0.3s, color 0.3s;
    }
    #begin-btn:hover { border-color: rgba(200,194,184,0.65); color: #e8e2da; }

    /* ── listening ── */
    #viz {
      display: block;
      width: min(600px, 88vw);
      height: 80px;
    }

    #out {
      margin-top: 52px; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      min-height: 150px; justify-content: center;
      opacity: 0; transform: translateY(10px);
      transition: opacity 0.85s ease, transform 0.85s ease;
    }
    #out.on { opacity: 1; transform: translateY(0); }

    #out-label {
      font-size: 0.64rem; letter-spacing: 0.44em; text-transform: uppercase;
      color: rgba(200,194,184,0.30);
    }
    #out-meaning {
      font-size: clamp(1.6rem, 3.4vw, 2.3rem); font-style: italic; font-weight: 300;
      color: #e8e2da; line-height: 1.25;
    }
    #out-science {
      font-size: 0.71rem; font-weight: 300; line-height: 1.80;
      color: rgba(200,194,184,0.28); max-width: 420px; letter-spacing: 0.03em;
    }
    #conf-bar { width: 90px; height: 1px; background: rgba(200,194,184,0.10); margin-top: 2px; }
    #conf-fill { height: 100%; width: 0%; background: rgba(200,194,184,0.40); transition: width 0.5s ease; }

    /* ── status ── */
    #status {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      font-size: 0.63rem; letter-spacing: 0.42em; text-transform: uppercase;
      color: rgba(200,194,184,0.25); white-space: nowrap; z-index: 10;
    }
    #status.pulse { animation: blink 2.6s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:0.28} 50%{opacity:0.85} }
  </style>
</head>
<body>

<a href="/" id="back">← Lab</a>

<div id="s-intro" class="state active">
  <h1>Caterwaul</h1>
  <p class="sub">a realtime cat translator...maybe</p>
  <button id="begin-btn">begin listening</button>
</div>

<div id="s-listen" class="state">
  <canvas id="viz"></canvas>
  <div id="out">
    <div id="out-label"></div>
    <div id="out-meaning"></div>
    <div id="out-science"></div>
    <div id="conf-bar"><div id="conf-fill"></div></div>
  </div>
</div>

<div id="status" class="pulse">ready</div>

<script>
'use strict';

// ── Constants ─────────────────────────────────────────────────────────────
const ONSET_THRESH   = 0.022;  // RMS energy level that marks sound onset
const PRE_BUF_SEC    = 0.35;   // seconds of audio kept before onset
const SILENCE_GAP_MS = 500;    // ms of quiet that marks end of clip
const MIN_CLIP_SEC   = 0.30;   // clips shorter than this are discarded
const MAX_CLIP_SEC   = 5.0;    // hard cap on clip length
const RESAMPLE_SR    = 16000;  // target sample rate for Gemini (WAV)

// ── State ──────────────────────────────────────────────────────────────────
let analyser    = null;
let nativeSR    = 44100;
let isRecording = false;
let clipBuffer  = [];
let preBuffer   = [];
let silenceTimer = null;
let busy        = false;
let fadeTimer   = null;
let waveHue     = 0;

// ── DOM ────────────────────────────────────────────────────────────────────
const sIntro   = document.getElementById('s-intro');
const sListen  = document.getElementById('s-listen');
const statusEl = document.getElementById('status');
const outDiv   = document.getElementById('out');
const outLabel = document.getElementById('out-label');
const outMean  = document.getElementById('out-meaning');
const outSci   = document.getElementById('out-science');
const confFill = document.getElementById('conf-fill');
const canvas   = document.getElementById('viz');

function showState(el) {
  document.querySelectorAll('.state').forEach(s => s.classList.remove('active'));
  el.classList.add('active');
}
function setStatus(txt, pulse = true) {
  statusEl.textContent = txt;
  statusEl.classList.toggle('pulse', pulse);
}

// ── Canvas ─────────────────────────────────────────────────────────────────
function resizeCanvas() {
  const r = devicePixelRatio || 1;
  canvas.width  = canvas.offsetWidth  * r;
  canvas.height = canvas.offsetHeight * r;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ── Waveform ───────────────────────────────────────────────────────────────
(function drawViz() {
  requestAnimationFrame(drawViz);
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  if (!analyser) return;

  const buf = new Float32Array(analyser.frequencyBinCount);
  analyser.getFloatTimeDomainData(buf);

  waveHue += (outDiv.classList.contains('on') ? 1 : -1) * 0.04;
  waveHue  = Math.max(0, Math.min(1, waveHue));

  const a  = 0.28 + waveHue * 0.55;
  const cr = Math.round(158 + waveHue * 57);
  const cg = Math.round(150 + waveHue * 14);
  const cb = Math.round(140 - waveHue * 54);
  ctx.strokeStyle = `rgba(${cr},${cg},${cb},${a})`;
  ctx.lineWidth   = (1.2 + waveHue * 0.9) * (devicePixelRatio || 1);
  ctx.lineJoin    = 'round';
  ctx.beginPath();
  const step = W / (buf.length - 1);
  for (let i = 0; i < buf.length; i++) {
    const x = i * step, y = (buf[i] * 0.65 + 0.5) * H;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
}());

// ── WAV encoding ───────────────────────────────────────────────────────────
// Encodes a Float32Array to a 16-bit mono WAV ArrayBuffer.
function encodeWAV(f32, sr) {
  const len  = f32.length;
  const buf  = new ArrayBuffer(44 + len * 2);
  const view = new DataView(buf);
  const ws   = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, 'RIFF'); view.setUint32(4, 36 + len * 2, true);
  ws(8, 'WAVE'); ws(12, 'fmt '); view.setUint32(16, 16, true);
  view.setUint16(20, 1, true); view.setUint16(22, 1, true);
  view.setUint32(24, sr, true); view.setUint32(28, sr * 2, true);
  view.setUint16(32, 2, true); view.setUint16(34, 16, true);
  ws(36, 'data'); view.setUint32(40, len * 2, true);
  let o = 44;
  for (let i = 0; i < len; i++) {
    const s = Math.max(-1, Math.min(1, f32[i]));
    view.setInt16(o, s < 0 ? s * 32768 : s * 32767, true); o += 2;
  }
  return buf;
}

function bufToBase64(buf) {
  const bytes = new Uint8Array(buf);
  const CHUNK = 8192;
  let out = '';
  for (let i = 0; i < bytes.length; i += CHUNK) {
    out += String.fromCharCode(...bytes.subarray(i, Math.min(i + CHUNK, bytes.length)));
  }
  return btoa(out);
}

// ── Show translation + speak ──────────────────────────────────────────────
function showAndSpeak(sound, meaning, science, confidence) {
  outLabel.textContent = sound;
  outMean.textContent  = `"${meaning}"`;
  outSci.textContent   = science;
  confFill.style.width = Math.round((confidence || 0) * 100) + '%';
  outDiv.classList.add('on');
  setStatus('cat detected', false);

  setTimeout(() => {
    window.speechSynthesis.cancel();
    const utt  = new SpeechSynthesisUtterance(meaning);
    utt.lang   = 'en-GB';
    utt.rate   = 0.88;
    window.speechSynthesis.speak(utt);
  }, 700);

  clearTimeout(fadeTimer);
  fadeTimer = setTimeout(() => {
    outDiv.classList.remove('on');
    setStatus('listening for your cat');
  }, 7000);
}

// ── Send clip to Gemini via backend ───────────────────────────────────────
async function translateClip(clipNative) {
  if (busy) return;
  busy = true;
  setStatus('translating…', false);

  try {
    // Resample native-rate clip to 16 kHz
    const targetLen = Math.ceil(clipNative.length * RESAMPLE_SR / nativeSR);
    const offCtx    = new OfflineAudioContext(1, targetLen, RESAMPLE_SR);
    const buf       = offCtx.createBuffer(1, clipNative.length, nativeSR);
    buf.copyToChannel(clipNative, 0);
    const src = offCtx.createBufferSource();
    src.buffer = buf; src.connect(offCtx.destination); src.start(0);
    const rendered = await offCtx.startRendering();
    const s16k     = rendered.getChannelData(0);

    const wavB64 = bufToBase64(encodeWAV(s16k, RESAMPLE_SR));

    const res  = await fetch('/api/caterwaul', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ audio: wavB64 }),
    });
    const data = await res.json();

    if (data.sound && data.sound !== 'none') {
      showAndSpeak(data.sound, data.meaning, data.science, data.confidence);
    } else {
      setStatus('listening for your cat');
    }
  } catch (err) {
    console.warn('translateClip:', err);
    setStatus('listening for your cat');
  }

  busy = false;
}

// ── Clip end: validate and hand off ──────────────────────────────────────
function endClip() {
  clearTimeout(silenceTimer);
  silenceTimer = null;
  isRecording  = false;

  const clip = new Float32Array(clipBuffer);
  clipBuffer  = [];

  if (clip.length < nativeSR * MIN_CLIP_SEC) {
    setStatus('listening for your cat');
    return;
  }

  translateClip(clip);
}

// ── Microphone + onset/offset detection ──────────────────────────────────
async function startMic() {
  const stream   = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  nativeSR       = audioCtx.sampleRate;

  const source = audioCtx.createMediaStreamSource(stream);

  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = 0.82;
  source.connect(analyser);

  // AudioWorklet — non-deprecated replacement for ScriptProcessorNode
  await audioCtx.audioWorklet.addModule('./audio-processor.js');
  const worklet = new AudioWorkletNode(audioCtx, 'cat-processor');
  source.connect(worklet);
  const sink = audioCtx.createGain();
  sink.gain.value = 0;
  worklet.connect(sink);
  sink.connect(audioCtx.destination);

  const PRE_MAX     = Math.ceil(PRE_BUF_SEC * nativeSR);
  const MAX_SAMPLES = Math.ceil(MAX_CLIP_SEC * nativeSR);

  worklet.port.onmessage = e => {
    const chunk = e.data; // Float32Array of 4096 samples

    // RMS energy of this chunk
    let sum = 0;
    for (let i = 0; i < chunk.length; i++) sum += chunk[i] * chunk[i];
    const rms = Math.sqrt(sum / chunk.length);

    if (!isRecording) {
      for (let i = 0; i < chunk.length; i++) preBuffer.push(chunk[i]);
      if (preBuffer.length > PRE_MAX) preBuffer = preBuffer.slice(-PRE_MAX);

      if (rms > ONSET_THRESH && !busy) {
        isRecording = true;
        clipBuffer  = [...preBuffer];
        for (let i = 0; i < chunk.length; i++) clipBuffer.push(chunk[i]);
        preBuffer   = [];
      }
    } else {
      for (let i = 0; i < chunk.length; i++) clipBuffer.push(chunk[i]);

      if (rms < ONSET_THRESH) {
        if (!silenceTimer) silenceTimer = setTimeout(endClip, SILENCE_GAP_MS);
      } else {
        clearTimeout(silenceTimer);
        silenceTimer = null;
      }

      if (clipBuffer.length >= MAX_SAMPLES) endClip();
    }
  };

  showState(sListen);
  setStatus('listening for your cat');
}

// ── Begin button ──────────────────────────────────────────────────────────
document.getElementById('begin-btn').addEventListener('click', async () => {
  try {
    setStatus('requesting microphone…', false);
    await startMic();
  } catch (err) {
    console.error(err);
    setStatus('microphone access denied', false);
  }
});
</script>

</body>
</html>
